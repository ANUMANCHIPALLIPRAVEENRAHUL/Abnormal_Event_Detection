{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="webthemez">
    <title>Live Video Feed</title>
    <link href="{%static 'css/bootstrap.min.css'%}" rel="stylesheet">
    <link href="{%static 'css/font-awesome.min.css'%}" rel="stylesheet">
    <link href="{%static 'css/animate.min.css'%}" rel="stylesheet">
    <link href="{%static 'css/prettyPhoto.css'%}" rel="stylesheet">
    <link href="{%static 'css/styles.css'%}" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{%static 'css/slider-style.css'%}" />
    <link rel="stylesheet" type="text/css" href="{%static 'css/slider-custom.css'%}" />
	<script type="text/javascript" src="{%static 'js/modernizr.custom.79639.js'%}"></script>
    <link rel="shortcut icon" href="{%static 'images/ico/favicon.ico'%}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    
        h1 {
            color: #333;
        }
    
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
    
        input[type="file"] {
            padding: 10px;
            margin-bottom: 10px;
        }
    
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body id="home">
    <header id="header">
        <nav id="main-nav" class="navbar navbar-default navbar-fixed-top" role="banner">
            <div class="container">
                <div class="navbar-header">
                    <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                        <span class="sr-only">Toggle navigation</span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                        <span class="icon-bar"></span>
                    </button>
                    <a class="navbar-brand"><h2>Abnormal detection</h2></a>
                </div>
                <div class="collapse navbar-collapse navbar-right">
                    <ul class="nav navbar-nav">
                        <li><a href='User_Home?id={{id}}'>Home</a></li>
                        <li><a href="#" id="trainBtn">DL</a></li>
                        <li><a href='predict_image?id={{id}}'>Predictions</a></li>
                        <li><a href='logout_views'>Log out</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <br><br><br><br>
    <title>Live Feed</title>
    <script>
        document.getElementById("trainBtn").addEventListener("click", function() {
            fetch('/training/')
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            function updateStatus() {
                $.ajax({
                    url: '/get_abnormal_status/',
                    type: 'GET',
                    success: function(data) {
                        $('#status').text(data.status);
                    }
                });
            }
            setInterval(updateStatus, 2000);
        });
    </script>
    <div>
        <h1>Live Feed</h1>
        <img src="/video_feed/" alt="Live Video Feed" width="640" height="480">
        <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
            <input type="hidden" name="id" value="{{id}}">
            <input type="file" name="media">
            <button type="submit">Upload File</button>
        </form>
    </div>
    <footer id="footer">
        <div class="container">
            <div class="row">
                <div class="col-sm-6">
                    &copy; 2025 All Rights Reserved</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="{%static 'js/jquery.js'%}"></script>
    <script src="{%static 'js/bootstrap.min.js'%}"></script>
    <script src="{%static 'js/mousescroll.js'%}"></script>
    <script src="{%static 'js/smoothscroll.js'%}"></script>
    <script src="{%static 'js/jquery.prettyPhoto.js'%}"></script>
    <script src="{%static 'js/jquery.isotope.min.js'%}"></script>
    <script src="{%static 'js/jquery.inview.min.js'%}"></script>
    <script src="{%static 'js/wow.min.js'%}"></script>
	<script type="text/javascript" src="{%static 'js/jquery.ba-cond.min.js'%}"></script>
    <script type="text/javascript" src="{%static 'js/jquery.slitslider.js'%}"></script>
	<script type="text/javascript" src="{%static 'js/slitslider-custom.js'%}"></script>
    <script src="{%static 'js/custom-scripts.js'%}"></script>
</body>
</html>
